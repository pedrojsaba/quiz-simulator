<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="Arial,Helvetica,sans-serif">
<style>
 .box{fill:#f4f6f8;stroke:#334;stroke-width:1.5}
 .hdr{fill:#1a1a2e}
 .lbl{font-size:14px;fill:#1a1a2e}
 .val{font-size:14px;fill:#a33;font-weight:bold}
 .cap{font-size:12px;fill:#555}
</style>
<rect x="20" y="20" width="480" height="40" rx="6" fill="#1a1a2e"/>
<text x="260" y="46" text-anchor="middle" font-size="15" fill="#fff">BMC Discovery Outpost — minimum requirements</text>

<rect x="20" y="70" width="480" height="40" class="box"/>
<text x="40" y="95" class="lbl">CPU</text>
<text x="480" y="95" text-anchor="end" class="val">2 cores</text>

<rect x="20" y="110" width="480" height="40" class="box"/>
<text x="40" y="135" class="lbl">Memory (no cloud / mainframe / storage)</text>
<text x="480" y="135" text-anchor="end" class="val">8 GB</text>

<rect x="20" y="150" width="480" height="40" class="box"/>
<text x="40" y="175" class="lbl">Memory (cloud / mainframe / storage)</text>
<text x="480" y="175" text-anchor="end" class="val">16 GB</text>

<rect x="20" y="190" width="480" height="40" class="box"/>
<text x="40" y="215" class="lbl">Hard disk</text>
<text x="480" y="215" text-anchor="end" class="val">60 GB</text>
</svg>
