<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Arial,Helvetica,sans-serif">
<style>
 .box{fill:#f4f6f8;stroke:#334;stroke-width:1.5}
 .lbl{font-size:13px;fill:#1a1a2e}
 .port{font-size:12px;fill:#a33;font-weight:bold}
 .arrow{stroke:#334;stroke-width:1.6;fill:none;marker-end:url(#ah)}
 .cap{font-size:12px;fill:#555}
</style>
<defs>
 <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
  <path d="M0,0 L6,3 L0,6 Z" fill="#334"/>
 </marker>
</defs>
<rect x="20" y="20" width="150" height="50" rx="6" class="box"/>
<text x="95" y="50" text-anchor="middle" class="lbl">BMC Discovery Appliance</text>

<rect x="250" y="20" width="150" height="50" rx="6" class="box"/>
<text x="325" y="42" text-anchor="middle" class="lbl">Windows Credential</text>
<text x="325" y="58" text-anchor="middle" class="lbl">Proxy</text>

<rect x="470" y="20" width="150" height="50" rx="6" class="box"/>
<text x="545" y="50" text-anchor="middle" class="lbl">Target Windows Host</text>

<line x1="170" y1="45" x2="248" y2="45" class="arrow"/>
<text x="200" y="38" class="port">4323</text>

<line x1="400" y1="45" x2="468" y2="45" class="arrow"/>

<rect x="250" y="150" width="150" height="50" rx="6" class="box"/>
<text x="325" y="172" text-anchor="middle" class="lbl">Windows AD</text>
<text x="325" y="188" text-anchor="middle" class="lbl">Proxy</text>

<rect x="470" y="150" width="150" height="50" rx="6" class="box"/>
<text x="545" y="180" text-anchor="middle" class="lbl">Target Windows Host</text>

<line x1="95" y1="70" x2="95" y2="175" class="arrow"/>
<line x1="95" y1="175" x2="248" y2="175" class="arrow"/>
<text x="140" y="168" class="port">4321</text>

<line x1="400" y1="175" x2="468" y2="175" class="arrow"/>

<text x="320" y="240" text-anchor="middle" class="cap">Credential Proxy = port 4323, vault on appliance · AD Proxy = port 4321, credentials on the proxy server</text>
</svg>
